---
- name: Ensure WinRM service is running
  ansible.windows.win_service:
    name: WinRM
    start_mode: auto
    state: started

# This is a common “bootstrap” step.
# For production, you’d likely use HTTPS listeners and certs.
- name: Enable PSRemoting (WinRM)
  ansible.windows.win_shell: |
    Enable-PSRemoting -Force
    winrm quickconfig -q
  args:
    executable: pwsh.exe

- name: Allow WinRM HTTP in firewall (5985)
  community.windows.win_firewall_rule:
    name: "WinRM HTTP (Ansible)"
    localport: 5985
    action: allow
    direction: in
    protocol: tcp
    enabled: yes
    state: present