---
- name: "=== COMMON role started ==="
  ansible.builtin.debug:
    msg: "Starting COMMON role on {{ inventory_hostname }} (env={{ env_name | default('N/A') }})"
    
# - name: Display the entire ansible_facts dictionary
#   ansible.builtin.debug:
#     var: ansible_facts

- name: Ensure base Ansible temp root exists
  ansible.builtin.file:
    path: /tmp
    state: directory
    mode: "1777"

- name: Enable repositories on RHEL-family
  when:
    - ansible_facts['os_family'] == "RedHat"
    - ansible_facts['pkg_mgr'] in ["dnf", "yum"]
    - dnf_repo_list | length > 0
  block:

    # make sure dnf pugins installed before we enable repos
    - name: Install common packages for RHEL/Rocky/Fedora/Alma
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present
        update_cache: true

    - name: Enable yum/dnf repositories
      ansible.builtin.command:
        cmd: "dnf config-manager --set-enabled {{ item }}"
      loop: "{{ dnf_repo_list }}"
      register: enable_repo_result
      changed_when: "'enabled' in enable_repo_result.stdout or enable_repo_result.rc == 0"
      failed_when: false
      when: dnf_repo_list | length > 0
    
    - name: Install common packages for RHEL/Rocky/Fedora/Alma
      ansible.builtin.dnf:
        name: "{{ dnf_common_packages }}"
        state: present
        update_cache: true
      when: dnf_common_packages | length > 0

    # - name: Ensure issue banner is generated
    #   ansible.builtin.template:
    #     src: issue.j2
    #     dest: /etc/issue
    #     owner: root
    #     group: root
    #     mode: '0644'

    # - name: Ensure SSH uses issue banner
    #   ansible.builtin.lineinfile:
    #     path: /etc/ssh/sshd_config
    #     regexp: '^#?Banner'
    #     line: 'Banner /etc/issue'
    #     state: present
    #   notify: Restart sshd

# - name: Install common packages for Debian/Ubuntu
#   ansible.builtin.apt:
#     name: "{{ apt_common_packages }}"
#     state: present
#     update_cache: true
#   when: ansible_facts['pkg_mgr'] == "apt" and apt_common_packages | length > 0

- name: Mask sshd RSA host key generation service
  ansible.builtin.systemd:
    name: sshd-keygen@rsa.service
    masked: yes
  ignore_errors: true

- name: Remove SSH RSA host keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/ssh_host_rsa_key
    - /etc/ssh/ssh_host_rsa_key.pub

- name: Install banner regeneration script
  ansible.builtin.template:
    src: update-issue.sh.j2
    dest: /usr/local/bin/update-issue.sh
    owner: root
    group: root
    mode: '0744'
  notify: Run banner update now

- name: Install systemd unit for banner update
  ansible.builtin.template:
    src: update-issue.service.j2
    dest: /etc/systemd/system/update-issue.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd


- name: Flush handlers so systemd sees new unit
  ansible.builtin.meta: flush_handlers

- name: Enable banner update service and run it now
  ansible.builtin.systemd:
    name: update-issue.service
    enabled: yes
    state: started

- name: Ensure SSH uses banner file
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Banner'
    line: 'Banner /etc/issue.net'
    state: present
  notify: Restart sshd

