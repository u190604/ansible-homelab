---
- name: 'Display role start message'
  ansible.builtin.debug:
    msg: 'Starting role on {{ inventory_hostname }} (env={{ env_name | default("N/A") }})'

# - name: Display the entire ansible_facts dictionary
#   ansible.builtin.debug:
#     var: ansible_facts

- name: Ensure base Ansible temp root exists
  ansible.builtin.file:
    path: /tmp
    state: directory
    mode: '1777'

- name: Enable repositories on RHEL-family
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['pkg_mgr'] in ['dnf', 'yum']
  block:

    # Ensure dnf plugins are available before enabling repos.
    - name: Install dnf plugins for RHEL-family
      ansible.builtin.dnf:
        name: 'dnf-plugins-core'
        state: present
        update_cache: true

    - name: Enable yum/dnf repositories
      ansible.builtin.command:
        cmd: 'dnf config-manager --set-enabled {{ item }}'
      loop: '{{ dnf_repo_list }}'
      changed_when: "'enabled' in enable_repo_result.stdout or enable_repo_result.rc == 0"
      failed_when: false
      register: enable_repo_result
      when: dnf_repo_list | length > 0

    - name: Install common packages for RHEL-family
      ansible.builtin.dnf:
        name: '{{ dnf_common_packages }}'
        state: present
        update_cache: true
      when: dnf_common_packages | length > 0

- name: Update system packages on RHEL-family
  ansible.builtin.dnf:
    name: '*'
    state: latest
    update_cache: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['pkg_mgr'] in ['dnf', 'yum']

- name: Check if reboot is required (needs-restarting)
  ansible.builtin.command:
    cmd: 'needs-restarting -r'
  changed_when: false
  failed_when: false
  register: reboot_check
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['pkg_mgr'] in ['dnf', 'yum']

- name: Reboot host when required
  ansible.builtin.reboot:
    reboot_timeout: 900
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['pkg_mgr'] in ['dnf', 'yum']
    - reboot_check.rc != 0

