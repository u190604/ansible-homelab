- name: Install banner regeneration script
  ansible.builtin.template:
    src: update-issue.sh.j2
    dest: /usr/local/bin/update-issue.sh
    owner: root
    group: root
    mode: '0744'
  notify: Run banner update now

- name: Install systemd unit for banner update
  ansible.builtin.template:
    src: update-issue.service.j2
    dest: /etc/systemd/system/update-issue.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd

- name: Flush handlers so systemd sees new unit
  ansible.builtin.meta: flush_handlers

- name: Check banner unit file exists
  ansible.builtin.stat:
    path: /etc/systemd/system/update-issue.service
  register: update_issue_unit

- name: Enable banner update service and run it now
  ansible.builtin.systemd:
    name: 'update-issue.service'
    enabled: true
    state: started
  when:
    - not ansible_check_mode or update_issue_unit.stat.exists

- name: Check sshd configuration file
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: common_sshd_config

- name: Ensure SSH uses banner file
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Banner'
    line: 'Banner /etc/issue.net'
    state: present
  notify: Restart sshd
  when:
    - common_sshd_config.stat.exists
    - not (common_is_local and common_is_wsl)

- name: Configure bash prompt for aglu user
  ansible.builtin.lineinfile:
    path: /home/aglu/.bashrc
    regexp: '^PS1='
    line: |-
      {% raw %}PS1='\n\[\e[36m\][\D{%Y-%m-%d %H:%M:%S}]\[\e[0m\] - \[\e[91m\]\u\[\e[0m\]@\[\e[33m\]\h\[\e[0m\] \[\e[38;5;208m\]#\[\e[0m\] '{% endraw %}
    create: true
    owner: aglu
    group: aglu
    mode: '0644'
    state: present
  become: true
