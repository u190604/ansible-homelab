---
- name: Reexec user systemd (quadlet generators)
  ansible.builtin.command:
    cmd: 'systemctl --user daemon-reexec'
  become: true
  become_user: '{{ podman_user }}'
  changed_when: true
  environment: '{{ podman_user_env }}'
  vars:
    ansible_remote_tmp: '{{ podman_remote_tmp }}'

- name: Reload user systemd
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: '{{ podman_user }}'
  environment: '{{ podman_user_env }}'
  vars:
    ansible_remote_tmp: '{{ podman_remote_tmp }}'

- name: Reload firewalld
  ansible.builtin.systemd:
    name: 'firewalld'
    state: reloaded
  become: true
