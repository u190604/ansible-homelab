---
- name: 'Display role start message'
  ansible.builtin.debug:
    msg: 'Starting role on {{ inventory_hostname }} (env={{ env_name | default("N/A") }})'

- name: Ensure play runs on RHEL-family OS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
    fail_msg: 'Role supports RHEL-family only.'
    success_msg: 'RHEL-family detected.'

- name: Validate pgadmin default password
  ansible.builtin.assert:
    that:
      - pgadmin_default_password is defined
      - pgadmin_default_password | default('') | length > 0
    fail_msg: 'pgadmin_default_password must be set for pgadmin hosts.'
    success_msg: 'pgadmin_default_password is defined.'

- name: Install firewalld package
  ansible.builtin.dnf:
    name:
      - 'firewalld'
    state: present
    update_cache: true
  become: true
  when: pgadmin_firewalld_manage | bool

- name: Ensure firewalld service enabled
  ansible.builtin.systemd:
    name: 'firewalld'
    enabled: true
    state: started
  become: true
  when: pgadmin_firewalld_manage | bool

- name: Open pgadmin firewall port
  ansible.posix.firewalld:
    port: '{{ pgadmin_listen_port }}/tcp'
    permanent: true
    immediate: true
    state: enabled
  become: true
  when: pgadmin_firewalld_manage | bool

- name: Configure pgadmin deployment
  block:
    - name: Stop legacy pgadmin service
      ansible.builtin.systemd:
        name: 'pgadmin'
        enabled: false
        state: stopped
      become: true
      failed_when: false

    - name: Stop legacy pgadmin4 service
      ansible.builtin.systemd:
        name: 'pgadmin4'
        enabled: false
        state: stopped
      become: true
      failed_when: false

    - name: Get podman user entry
      ansible.builtin.getent:
        database: passwd
        key: '{{ podman_user }}'

    - name: Display podman user entry
      ansible.builtin.debug:
        var: ansible_facts.getent_passwd

    - name: Define podman user runtime env
      ansible.builtin.set_fact:
        podman_user_uid: '{{ ansible_facts.getent_passwd[podman_user][1] }}'
        podman_user_env:
          XDG_RUNTIME_DIR: '/run/user/{{ ansible_facts.getent_passwd[podman_user][1] }}'
          DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/{{ ansible_facts.getent_passwd[podman_user][1] }}/bus'

    - name: Enable systemd lingering for podman user
      ansible.builtin.command:
        cmd: 'loginctl enable-linger {{ podman_user }}'
      changed_when: false

    - name: Ensure Quadlet directory exists (user)
      ansible.builtin.file:
        path: '{{ podman_home }}/.config/containers/systemd'
        state: directory
        owner: '{{ podman_user }}'
        group: '{{ podman_group }}'
        mode: '0755'

    - name: Deploy pgadmin volume Quadlet
      ansible.builtin.template:
        src: pgadmin-data.volume.j2
        dest: '{{ podman_home }}/.config/containers/systemd/{{ pgadmin_volume_name }}.volume'
        owner: '{{ podman_user }}'
        group: '{{ podman_group }}'
        mode: '0644'
      notify:
        - Reexec user systemd (quadlet generators)
        - Reload user systemd

    - name: Deploy pgadmin container Quadlet
      ansible.builtin.template:
        src: pgadmin.container.j2
        dest: '{{ podman_home }}/.config/containers/systemd/pgadmin.container'
        owner: '{{ podman_user }}'
        group: '{{ podman_group }}'
        mode: '0644'
      notify:
        - Reexec user systemd (quadlet generators)
        - Reload user systemd

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable and start pgadmin container
      ansible.builtin.systemd:
        name: 'pgadmin.service'
        enabled: true
        state: started
        scope: user
      become: true
      become_user: '{{ podman_user }}'
      environment: '{{ podman_user_env }}'
      vars:
        ansible_remote_tmp: '{{ podman_remote_tmp }}'
  when:
    - pgadmin_enable_podman | bool
