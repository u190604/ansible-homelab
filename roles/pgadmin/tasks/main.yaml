---
- name: 'Display role start message'
  ansible.builtin.debug:
    msg: 'Starting role on {{ inventory_hostname }} (env={{ env_name | default("N/A") }})'

- name: Ensure play runs on RHEL-family OS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
    fail_msg: 'Role supports RHEL-family only.'
    success_msg: 'RHEL-family detected.'

- name: Install pgadmin system packages
  ansible.builtin.dnf:
    name: '{{ pgadmin_system_packages }}'
    state: present
    update_cache: true
  become: true

- name: Ensure firewalld service enabled
  ansible.builtin.systemd:
    name: 'firewalld'
    enabled: true
    state: started
  become: true
  when: pgadmin_firewalld_manage | bool

- name: Ensure pgadmin group exists
  ansible.builtin.group:
    name: '{{ pgadmin_group }}'
    state: present
  become: true

- name: Ensure pgadmin user exists
  ansible.builtin.user:
    name: '{{ pgadmin_user }}'
    group: '{{ pgadmin_group }}'
    home: '{{ pgadmin_home }}'
    create_home: true
    shell: /sbin/nologin
    system: true
    state: present
  become: true

- name: Ensure pgadmin home directory exists
  ansible.builtin.file:
    path: '{{ pgadmin_home }}'
    state: directory
    owner: '{{ pgadmin_user }}'
    group: '{{ pgadmin_group }}'
    mode: '0750'
  become: true

- name: Ensure pgadmin config directory exists
  ansible.builtin.file:
    path: '{{ pgadmin_config_dir }}'
    state: directory
    owner: '{{ pgadmin_user }}'
    group: '{{ pgadmin_group }}'
    mode: '0700'
  become: true

- name: Ensure pgadmin data directory exists
  ansible.builtin.file:
    path: '{{ pgadmin_data_dir }}'
    state: directory
    owner: '{{ pgadmin_user }}'
    group: '{{ pgadmin_group }}'
    mode: '0700'
  become: true

- name: Ensure pgadmin log directory exists
  ansible.builtin.file:
    path: '{{ pgadmin_log_dir }}'
    state: directory
    owner: '{{ pgadmin_user }}'
    group: '{{ pgadmin_group }}'
    mode: '0750'
  become: true

- name: Ensure pgadmin storage directory exists
  ansible.builtin.file:
    path: '{{ pgadmin_storage_dir }}'
    state: directory
    owner: '{{ pgadmin_user }}'
    group: '{{ pgadmin_group }}'
    mode: '0700'
  become: true

- name: Verify uv is installed
  ansible.builtin.command:
    cmd: '{{ pgadmin_uv_bin }} --version'
  changed_when: false
  become: true

- name: Check pgadmin virtual environment
  ansible.builtin.stat:
    path: '{{ pgadmin_virtualenv_path }}'
  register: pgadmin_venv_stat

- name: Check pgadmin virtual environment python version
  ansible.builtin.command:
    cmd: '{{ pgadmin_virtualenv_path }}/bin/python -c ''import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")'''
  changed_when: false
  failed_when: false
  register: pgadmin_venv_python_version
  when:
    - pgadmin_venv_stat.stat.exists
    - not ansible_check_mode

- name: Remove pgadmin virtual environment
  ansible.builtin.file:
    path: '{{ pgadmin_virtualenv_path }}'
    state: absent
  become: true
  when:
    - pgadmin_venv_stat.stat.exists
    - not ansible_check_mode
    - pgadmin_recreate_venv | bool or (pgadmin_venv_python_version.stdout is defined and pgadmin_venv_python_version.stdout != common_python_version)

- name: Create pgadmin virtual environment
  ansible.builtin.command:
    cmd: '{{ pgadmin_uv_bin }} venv --python {{ pgadmin_python_bin }} {{ pgadmin_virtualenv_path }}'
    creates: '{{ pgadmin_virtualenv_path }}/bin/python'
  become: true
  become_user: '{{ pgadmin_user }}'
  when:
    - not ansible_check_mode

- name: Check for pgadmin4 package
  ansible.builtin.command:
    cmd: '{{ pgadmin_uv_bin }} pip show --python {{ pgadmin_virtualenv_path }} pgadmin4'
  become: true
  become_user: '{{ pgadmin_user }}'
  changed_when: false
  failed_when: false
  register: pgadmin_package_check
  when:
    - not ansible_check_mode

- name: Install pgadmin4 package
  ansible.builtin.command:
    cmd: '{{ pgadmin_uv_bin }} pip install --python {{ pgadmin_virtualenv_path }} {{ pgadmin_package_spec }}'
  become: true
  become_user: '{{ pgadmin_user }}'
  when:
    - not ansible_check_mode
    - pgadmin_package_check is defined
    - pgadmin_package_check.rc != 0

- name: Configure pgadmin runtime settings
  ansible.builtin.template:
    src: config_local.py.j2
    dest: '{{ pgadmin_config_dir }}/config_local.py'
    owner: '{{ pgadmin_user }}'
    group: '{{ pgadmin_group }}'
    mode: '0600'
  become: true
  notify: Restart pgadmin

- name: Install pgadmin systemd unit
  ansible.builtin.template:
    src: pgadmin.service.j2
    dest: /etc/systemd/system/{{ pgadmin_service_name }}.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Reload systemd
    - Restart pgadmin

- name: Remove legacy pgadmin4 systemd unit
  ansible.builtin.file:
    path: /etc/systemd/system/pgadmin4.service
    state: absent
  become: true
  notify: Reload systemd

- name: Flush handlers so systemd sees new unit
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Enable and start pgadmin service
  ansible.builtin.systemd:
    name: '{{ pgadmin_service_name }}'
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode

- name: Open pgadmin firewall port
  ansible.posix.firewalld:
    port: '{{ pgadmin_listen_port }}/tcp'
    permanent: true
    immediate: true
    state: enabled
  become: true
  when: pgadmin_firewalld_manage | bool
