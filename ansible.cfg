[privilege_escalation]
become=True
become_method=sudo

[defaults]
inventory = inventory
roles_path = roles
collections_path = ./collections/ansible_collections
interpreter_python = auto_silent
host_key_checking = False
log_path=ansible.log
remote_tmp = /tmp/ansible-${USER}/tmp

[winrm]
scheme = http
port = 5985
transport = ntlm